# .ao/config.yaml — AO self-development config
#
# This file wires AO's own repo as the target for AO-v1-driven workflows.
# Isolation model:
#   `ao`          → AO-v1, globally installed via `./install.sh` (non-editable snapshot)
#   `uv run ao`   → AO-v2, current working copy (dev version)
#
# To run an AO-v1 workflow against this repo:
#   ao run --workflow specs/self-dev/<workflow>.json
# or simply:
#   ao run   (picks up this config automatically)

# Default reposet and agents for AO self-development.
# Paths are relative to this file's directory (the repo root).
reposets: ../specs/self-dev/reposet.json
agents:   ../specs/self-dev/agents.json

# workflow: ../specs/self-dev/<workflow>.json  # set per-run or define a default here

# env:
#   ANTHROPIC_API_KEY: ...   # if not already in your shell environment

# Sentinel (opt-in run-long overseer lane; see docs-md/guide-sentinel.md). Off unless enabled here, by --sentinel,
# AO_SENTINEL_ENABLED, a workflow `sentinel:` block or a template param. Same keys in all of them.
# sentinel:
#   enabled: true
#   max_parallel_ceiling: 8        # upper bound for `ao ctl set max_parallel=N`
#   recovery:
#     idle_kill_minutes: 15        # floor 12 unless recovery.force
#     max_recovery_kills_per_task: 2
#   bandwidth:
#     backlog_release: true
#     early_checkpoint: true
#   llm:                           # LLM lane stays opt-in
#     enabled: false
#     powers: advise               # advise | act
#     budget_usd: 5
