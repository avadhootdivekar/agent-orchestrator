version: "1.0"
name: routed-runner
description: >-
  One prompt -> classified route (bug/epic/task/documentation/testing) -> done.
  A classify router reads prompt.md and drives only the matching pipeline to
  completion (design/review/task-fan-out for epics, triage/fix/test for bugs,
  plan/implement/test/review/fix/re-test for tasks, plan/write/review for docs,
  gap-analysis/write/run for testing) with a shared git-branch-off head and a
  per-route git-push tail. See this template's README.md for the full route
  table and breaker rationale.
id_pattern: "e-{rand6}-{slug}"
instance_dir: "workflows/routed-runner/runs/{id}"
params:
  type:
    description: Force the route (omit to auto-classify from prompt.md)
    required: false
    enum: [bug, epic, task, documentation, testing]
  repo_set:
    description: >-
      Key into this workspace's reposet config -- the repo(s) every stage of the run operates
      on. Optional: omit (or leave empty) for workspace-only (no-repo-set) mode, where the run
      works only on workspace-relative files and git stages have nothing to operate on
      (ADR-0022).
    required: false
    default: ""
  branch_policy:
    description: >-
      Free-text policy for how the git-branch-off stage should choose between
      reusing the current branch and starting fresh off latest main -- e.g.
      "always branch fresh off main", "keep working on the current branch
      unless it's already merged", or "never create a branch, fail if the
      tree is dirty". git-operator combines this stated intent with the
      actual git state (merged-into-base / dirty / no-upstream / already-on-
      base) to decide; a genuine conflict between policy and reality pauses
      for human input instead of guessing or forcing it.
    required: false
    default: >-
      reuse the current branch unless it is already merged into main, in
      which case start fresh from latest main
  task_budget_usd:
    description: >-
      Per-task real-spend USD cap (task_cost_usd circuit breaker threshold;
      mode "recommend" -- one bounded auto-extension before a repeat trip
      hard-fails the task).
    required: false
    default: "75"
  run_budget_usd:
    description: >-
      Per-run real-spend USD cap (run_cost_usd circuit breaker threshold;
      mode "recommend" -- one bounded auto-extension before a repeat trip
      hard-stops the run).
    required: false
    default: "1500"
dirs:
  - outputs
  - outputs/bug
  - outputs/epic
  - outputs/task
  - outputs/doc
  - outputs/testing
  - outputs/tasks
  - control
  - needs-input
files:
  - source: workflow.json.tmpl
    target: workflow.json
  - source: prompt.md.tmpl
    target: prompt.md
    keep_existing: true
  - source: breakdown-contract.md.tmpl
    target: breakdown-contract.md
  - content: "{{ params.type }}\n"
    target: outputs/forced-type.txt
    when: type
  - content: "{{ params.branch_policy }}\n"
    target: outputs/branch-policy.txt
assets:
  - source: instructions/
    target: workflows/routed-runner/instructions/
    keep_existing: true
  - source: agents.recommended.json.tmpl
    target: agents.recommended.json
    keep_existing: true
required_agents:
  - architect
  - architect-opus
  - developer
  - full-tester
  - git-operator
  - manager
  - market-surveyor
  - merge-resolver
  - reviewer
  - reviewer-opus
  - tester
