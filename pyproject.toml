[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "croniter>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "pytest-cov>=5.0"]
# Large-tier SWE-bench import + grading (E-Bt4Xk9 T-Sw5Hd9/T-Sg6Jf2). Lazy-imported
# inside bench/swebench_import.py + bench/swebench_provider.py (and the T-Sg6Jf2
# grader) ONLY -- never imported by core or by bench/cli.py at module scope (SI-1 /
# NFR-1). Install via `uv sync --extra swebench`.
swebench = ["datasets>=2.18", "swebench>=2.1"]
# Browser dashboard (E-Ui7Kq2). Imported ONLY by agent_orchestrator/ui/app.py and the
# `ao ui` command body -- never by the engine, the core CLI paths, or ui/service.py, so a
# core install stays on the five base dependencies. Install via `uv sync --extra ui`.
# httpx is required by fastapi.testclient, which the integration/e2e tests drive.
ui = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
ao = "agent_orchestrator.cli:app"
ao-bench = "agent_orchestrator.bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestrator"]
# The built dashboard frontend is data, not Python, so it needs an explicit include to
# land in the wheel. Committed (see .gitignore) so `pip install` ships a working
# dashboard without requiring node at install time.
artifacts = ["src/agent_orchestrator/ui/static/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "croniter", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional swebench extra (E-Bt4Xk9 T-Sw5Hd9/T-Sg6Jf2), lazy-imported only inside
# bench/swebench_import.py function bodies -- untyped/no py.typed marker upstream.
module = ["datasets", "datasets.*", "swebench", "swebench.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# _build_info is generated by hatch_build.py only at package-build time; it
# never exists in the source tree mypy checks.
module = ["agent_orchestrator._build_info"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_llm: opt-in real ClaudeCliExecutor tier; set AO_E2E_REAL_LLM=1 to run",
    "e2e: end-to-end test via the ao CLI",
    "perf: performance envelope checks",
    "swebench: opt-in real network/HF/git SWE-bench tier; set AO_E2E_SWEBENCH=1 to run",
]
